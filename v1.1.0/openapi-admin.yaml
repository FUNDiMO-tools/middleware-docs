          type: string
          x-sent-by: mw
          description: When the middleware signed it, in RFC 3339 and UTC. `NotBefore` may be earlier.
        NotBefore:
          type: string
          x-sent-by: mw
          description: Its X.509 `notBefore`, in RFC 3339 and UTC.
        NotAfter:
          type: string
          x-sent-by: mw
          description: Its X.509 `notAfter`, when it expires, in RFC 3339 and UTC.
        RenewFrom:
          type: string
          x-sent-by: mw
          description: >-
