        Adapter:
          type: [string, 'null']
          enum: [signed_value, sandbox_signed_value, null]
          x-sent-by: mw
          description: The attached credential's `Adapter`. Absent where none is attached.
        Since:
          type: [string, 'null']
          x-sent-by: mw
          description: When the credential was attached, in RFC 3339 and UTC. Absent where none is.
        AcceptorIdentification:
          type: [string, 'null']
          pattern: '^[!-~]{1,140}$'
          x-sent-by: mw
          description: >-
            The store's own number at its fleet's payment system: `null` where the store holds none. Always present.
        UserName:
          type: [string, 'null']
          pattern: '^[!-~]{1,140}$'
          x-sent-by: mw
          description: >-
            The attachment's merchant user at the fleet's payment system, `null` where the attachment holds none. Absent where none is attached.
        LastResult:
          type: [object, 'null']
