              x-sent-by: mw
              description: The terminal that reported.
            Response:
              type: string
              enum: [SUCC, FAIL]
              x-sent-by: mw
              description: What the terminal reported its fleet's payment system answered.
            ResponseReason:
              type: [string, 'null']
              enum: [not_covered, not_accepted, no_answer, key_unknown, signature_refused, application_unknown, null]
              x-sent-by: mw
              description: Why a `FAIL`, and `null` with `SUCC`.
            At:
              type: string
              x-sent-by: mw
              description: The middleware's clock at the report, in RFC 3339 and UTC.
    StoreSignInKeyRequest:
      type: object
      additionalProperties: false
      required: [Adapter, KeyIdentification]
      if:
        properties:
          Adapter:
            const: signed_value
        required: [Adapter]
      then:
        required: [Secret, SecretEncoding]
        properties:
