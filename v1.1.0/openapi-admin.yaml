        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
    get:
      tags: [stores]
      operationId: readAcceptedVendors
      summary: Show which vendors' registers a store accepts.
      description: >-
        The `admin` of the store's owner, the operator, or `onboarding`. The list as it stands, in the keys `PUT` on this path takes, so whoever changes it sees the list it would replace.
      responses:
        '200':
          description: The list as it stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedVendorsView'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
