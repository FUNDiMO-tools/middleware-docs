      type: object
      required: [CertificateChain, SpiffeId, NotAfter, RenewFrom]
      oneOf:
        - required: [POIIdentification]
        - required: [RegisterIdentification]
        - required: [ServerIdentification]
      description: >-
        A certificate just issued, by enrolment or renewal, and the principal it names, by exactly one of its ids. A certificate is public.
      properties:
        CertificateChain:
          type: string
          x-sent-by: mw
          description: The certificate then its issuer's, PEM. Present both at the TLS handshake.
        POIIdentification:
          type: [string, 'null']
          x-sent-by: mw
          description: A terminal's id, when the certificate is a terminal's.
        RegisterIdentification:
          type: [string, 'null']
          pattern: '^reg_[0-9a-f]{32}$'
          x-sent-by: mw
          description: A register's id, when the certificate is a register's.
        ServerIdentification:
          type: [string, 'null']
          pattern: '^srv_[0-9a-f]{32}$'
          x-sent-by: mw
          description: A vendor's server's id, when the certificate is a server's.
        SpiffeId:
          type: string
          x-sent-by: mw
          description: >-
            The certificate's one SAN, `spiffe://`, the middleware's trust domain, then the environment, the role and the id, each after a `/`.
        NotAfter:
          type: string
          x-sent-by: mw
          description: When the certificate expires, in RFC 3339.
        RenewFrom:
          type: string
          x-sent-by: mw
          description: When it may renew, day 15 of its life, in RFC 3339.
    CertificateStatus:
      type: object
      required: [NotAfter, RenewFrom, RenewNow]
      description: The certificate presented, as its daily check reads it.
      properties:
        NotAfter:
          type: string
          x-sent-by: mw
          description: When it expires, in RFC 3339.
        RenewFrom:
          type: string
          x-sent-by: mw
          description: When it may renew, day 15 of its life, in RFC 3339.
        RenewNow:
          type: boolean
          x-sent-by: mw
          description: Whether to renew it now, by the middleware's clock.
