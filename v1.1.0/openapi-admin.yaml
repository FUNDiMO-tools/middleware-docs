  /v1/enrol:
    post:
      tags: [certificates]
      operationId: enrol
      summary: Spend a pairing code for a first certificate.
      security: []
      description: >-
        No credential: the code is the credential, spent here by a terminal, a register's device or a vendor's server listed with a `PairingCode` for its first client certificate. `/docs/api/onboarding-device.md` § 6 walks a device's enrolment, and § The challenge, worked says how to compute the challenge its key is made with.
      requestBody:
        required: true
        description: The enrolment. At most 65,536 bytes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Enrolment'
      responses:
        '200':
          description: The same certificate, to a repeat of an enrolment with the same code and key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentIssued'
        '201':
          description: >-
            The certificate, the principal's id, and when to renew it. The code is spent, and the principal is now `paired`, `active` or `enrolled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentIssued'
        '400':
          description: |
            The body is refused, and each code means what it means on `POST /v1/sales`.

            - `invalid_json`: the body is not a JSON object.
            - `unknown_field`: the body holds a field this operation does not name, or a server's
              enrolment sends `AttestationChain`.
            - `missing_field`: a required field is absent. A device's five words sent with no
              `SerialNumber`, or with it `null`, are this, naming `SerialNumber`.
            - `invalid_field`: a field breaks its rule, or, behind a good code, the CSR's signature
              does not verify or its key is not P-256, which counts an attempt. A `SerialNumber`
              sent reads the code as a device's five words, so a server's code sent with a
              `SerialNumber` is this, naming `PairingCode`, before any row is read and with no
              attempt counted.
            - `body_unreadable`: the body could not be read to its end.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_json:
                  value: {"Error": {"Code": "invalid_json", "Message": "The body is not a JSON object.", "Fields": []}}
                unknown_field:
                  value: {"Error": {"Code": "unknown_field", "Message": "The body holds a field the contract does not define.", "Fields": ["AttestationChain"]}}
                missing_field:
                  value: {"Error": {"Code": "missing_field", "Message": "The body lacks a field the contract requires.", "Fields": ["CertificateSigningRequest"]}}
                invalid_field:
                  value: {"Error": {"Code": "invalid_field", "Message": "A field does not meet its rule in the contract.", "Fields": ["CertificateSigningRequest"]}}
                body_unreadable:
                  value: {"Error": {"Code": "body_unreadable", "Message": "The body could not be read.", "Fields": []}}
        '403':
          description: |
            Refused, and nothing is issued.

            - `code_not_valid`: the code is wrong, unknown, expired or spent, the serial is not the
              listing's, the principal is not `listed`, or its vendor is suspended, one code for
              every reason. A code no row holds counts nothing: a device's wrong serial or first
              word, or a server's wrong first 6 characters, finds no row.
            - `attestation_failed`: the device's chain fails a check of the chain, its root, its
              dates, revocation, the extension, the key, the hardware, the challenge or the boot
              state, or does not parse, or a device on a `live` middleware sent none. A middleware
              set to mark admits a device whose chain fails only checks it records, and one that
              sent none, and marks its certificate with those checks, or `chain_missing`
              (`DeviceAttestation`).
            - `app_identity_unknown`: the app the chain names is not registered for the vendor and
              the principal's role, or more than one app shares the key.
            - `model_not_allowed`: no row of the allowed list admits what the device attests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                code_not_valid:
                  value: {"Error": {"Code": "code_not_valid", "Message": "The pairing code is not valid.", "Fields": []}}
                attestation_failed:
                  value: {"Error": {"Code": "attestation_failed", "Message": "The device's key attestation does not pass.", "Fields": []}}
                app_identity_unknown:
                  value: {"Error": {"Code": "app_identity_unknown", "Message": "The app holding the key is not one registered for this device.", "Fields": []}}
                model_not_allowed:
                  value: {"Error": {"Code": "model_not_allowed", "Message": "The device is not of a model the allowed list admits.", "Fields": []}}
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429':
          description: >-
            Sent by the edge in front of a hosted middleware, never by the middleware itself: more enrolments came from your address in a minute than the edge allows, and its body is the edge's, not an `Error`. The code was not read and no attempt is counted, so wait a minute, then send the same request again.
        '503':
          description: |
            No verdict on the code: nothing is written, no attempt is counted, and the code stays
            live, so retry on the normal backoff with the same code and the same key.

            - `store_unavailable`: the middleware's store did not answer.
            - `ca_unavailable`: the middleware could not sign the certificate.
            - `attestation_status_unavailable`: a device's enrolment on a `live` middleware, which
              holds no attestation status list fresh enough to check the chain for revocation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                store_unavailable:
                  value: {"Error": {"Code": "store_unavailable", "Message": "The store is not available. Retry.", "Fields": []}}
                ca_unavailable:
                  value: {"Error": {"Code": "ca_unavailable", "Message": "The certificate authority could not sign. Retry.", "Fields": []}}
                attestation_status_unavailable:
                  value: {"Error": {"Code": "attestation_status_unavailable", "Message": "The attestation status list is not current. Retry.", "Fields": []}}
  /v1/certificates/self:
    get:
      tags: [certificates]
      operationId: readOwnCertificate
      summary: The daily check of the certificate presented.
      security:
        - mutualTLS: []
      description: >-
        Any certificate, on itself, once a day: the middleware answers the certificate's `NotAfter`, its `RenewFrom`, day 15 of its life, and `RenewNow`, so a holder's own clock decides nothing. `/docs/api/onboarding-device.md` § 9 says when to renew, and how a refusal of the check is read.
      responses:
        '200':
          description: The certificate's dates, and whether to renew it now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateStatus'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/certificates/renew:
    post:
      tags: [certificates]
      operationId: renewCertificate
      summary: Renew the certificate presented, with a new key.
      security:
        - mutualTLS: []
      description: >-
        Any certificate, from its `RenewFrom`, with a new key: the middleware runs enrolment's checks with the caller's certificate where the code was, and answers as enrolment does. `/docs/api/onboarding-device.md` § 10 says when to use the new certificate and delete the old key, and how long the old one stays good.
      requestBody:
        required: true
        description: The renewal. At most 65,536 bytes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Renewal'
      responses:
        '200':
          description: The same certificate, to a repeat of a renewal with the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentIssued'
        '201':
          description: The new certificate, the principal's id, and when to renew it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentIssued'
        '400':
          description: |
            The body is refused, nothing is issued, and each code means what it means on
            `POST /v1/sales`.

            - `invalid_json`: the body is not a JSON object.
            - `unknown_field`: the body holds a field this operation does not name, or a server's
              renewal sends `AttestationChain`.
            - `missing_field`: a required field is absent.
            - `invalid_field`: a field breaks its rule, the CSR's signature does not verify or its
              key is not P-256, or its key is one the principal has used before.
            - `body_unreadable`: the body could not be read to its end.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_json:
                  value: {"Error": {"Code": "invalid_json", "Message": "The body is not a JSON object.", "Fields": []}}
                unknown_field:
                  value: {"Error": {"Code": "unknown_field", "Message": "The body holds a field the contract does not define.", "Fields": ["AttestationChain"]}}
                missing_field:
                  value: {"Error": {"Code": "missing_field", "Message": "The body lacks a field the contract requires.", "Fields": ["CertificateSigningRequest"]}}
                invalid_field:
                  value: {"Error": {"Code": "invalid_field", "Message": "A field does not meet its rule in the contract.", "Fields": ["CertificateSigningRequest"]}}
                body_unreadable:
                  value: {"Error": {"Code": "body_unreadable", "Message": "The body could not be read.", "Fields": []}}
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          description: |
            Refused, and nothing is issued: the current certificate stays as it was.

            - `not_permitted`: the principal is not `paired`, `active` or `enrolled`, or its vendor
              is not `active`, so a suspended vendor's certificate cannot renew.
            - `certificate_retired`: the certificate presented is retired, or set to retire at the
              end of an overlap, because a newer one of the identity is in use. Renew on the newer
              one, or on the holder's newest, stop and tell a person: something else holds a newer
              certificate of this identity.
            - `challenge_not_valid`: a device's renewal came when no challenge of this
              certificate's was live, with a chain or, in the sandbox and on a middleware set to
              mark, without one; or its chain was made with another. Ask a new challenge, and
              make a new key with it.
            - `attestation_failed`, `app_identity_unknown` and `model_not_allowed`: the device's
              chain is refused as at enrolment. The current certificate stays good until its
              `NotAfter`, and the middleware writes a `WARNING` naming the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_permitted:
                  value: {"Error": {"Code": "not_permitted", "Message": "The caller is not permitted to do this.", "Fields": []}}
                certificate_retired:
                  value: {"Error": {"Code": "certificate_retired", "Message": "The certificate presented is retired: a newer one of this identity is in use.", "Fields": []}}
                challenge_not_valid:
                  value: {"Error": {"Code": "challenge_not_valid", "Message": "The key was not made with a live challenge of this certificate's. Ask a new one.", "Fields": []}}
                attestation_failed:
                  value: {"Error": {"Code": "attestation_failed", "Message": "The device's key attestation does not pass.", "Fields": []}}
                app_identity_unknown:
                  value: {"Error": {"Code": "app_identity_unknown", "Message": "The app holding the key is not one registered for this device.", "Fields": []}}
                model_not_allowed:
                  value: {"Error": {"Code": "model_not_allowed", "Message": "The device is not of a model the allowed list admits.", "Fields": []}}
        '409':
          description: >-
            `renewal_not_due`: the certificate is before its `RenewFrom`, and nothing is issued. Keep using it, and renew once the daily check answers `RenewNow` `true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                renewal_not_due:
                  value: {"Error": {"Code": "renewal_not_due", "Message": "The certificate is not due for renewal yet: its daily check says from when.", "Fields": []}}
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429':
          description: >-
            `renewal_rate`: this identity was issued 5 certificates in the last 24 hours, so the middleware writes a `WARNING`: a second renewer is the best sign of a fork. Keep the current certificate and renew later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                renewal_rate:
                  value: {"Error": {"Code": "renewal_rate", "Message": "This identity was issued 5 certificates in the last 24 hours. Retry later.", "Fields": []}}
        '503':
          description: |
            No verdict on the certificate: nothing is issued and a challenge is not spent, so retry
            on the normal backoff with the same key.

            - `store_unavailable`: the middleware's store did not answer.
            - `ca_unavailable`: the middleware could not sign the certificate.
            - `attestation_status_unavailable`: a device's renewal on a `live` middleware, which
              holds no attestation status list fresh enough to check the chain for revocation.
            - `edge_not_trusted`: behind the load balancer, the request did not come through a
              trusted edge. It is an edge fault, and the certificate is not in question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                store_unavailable:
                  value: {"Error": {"Code": "store_unavailable", "Message": "The store is not available. Retry.", "Fields": []}}
                ca_unavailable:
                  value: {"Error": {"Code": "ca_unavailable", "Message": "The certificate authority could not sign. Retry.", "Fields": []}}
                attestation_status_unavailable:
                  value: {"Error": {"Code": "attestation_status_unavailable", "Message": "The attestation status list is not current. Retry.", "Fields": []}}
                edge_not_trusted:
                  value: {"Error": {"Code": "edge_not_trusted", "Message": "The request did not come through a trusted edge. Retry.", "Fields": []}}
components:
  securitySchemes:
    sandboxKey:
      type: http
      scheme: bearer
      description: >-
        A sandbox key, `sbx_` then 43 base64url characters, sent as `Authorization: Bearer`. It works in the sandbox alone, and its scope decides what it reaches: `pos` a register's sales and reads and its vendor's terminal connections, `admin` the Operator API inside its own vendor, `operator` FUNDiMO's routes, and `onboarding` the onboarding routes for every vendor, FUNDiMO's onboarding team's.
    mutualTLS:
      type: mutualTLS
      description: >-
        A client certificate from the middleware's own CA, presented at the TLS handshake with the issuing certificate beside it, as `CertificateChain` gave them, and never with an `Authorization` header. Its one SAN, a SPIFFE URI, names the environment, the role, `terminal`, `register`, `server` or `operator`, and the id, and a `server` certificate's scope decides what it reaches as a sandbox key's does.
  parameters:
    PageSize:
      name: page_size
      in: query
      required: false
      x-sent-by: vendor
      description: The most rows a page holds, from 1 to 100. Absent, 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageAfter:
      name: page_after
      in: query
      required: false
      x-sent-by: vendor
      description: >-
        The `NextPage` of the page before, sent back unchanged, for the page after it. Absent, the first page.
      schema:
        type: string
        minLength: 1
    VendorIdentification:
      name: VendorIdentification
      in: path
      required: true
      x-sent-by: vendor
      description: A vendor, by the id the middleware issued it.
      schema:
        type: string
        pattern: '^ven_[0-9a-f]{32}$'
    ServerIdentification:
      name: ServerIdentification
      in: path
      required: true
      x-sent-by: vendor
      description: A vendor's server, by the id the middleware issued it.
      schema:
        type: string
        pattern: '^srv_[0-9a-f]{32}$'
    AppIdentification:
      name: AppIdentification
      in: path
      required: true
      x-sent-by: vendor
      description: An app identity, by the id the middleware issued it.
      schema:
        type: string
        pattern: '^app_[0-9a-f]{32}$'
    SignInCredentialIdentification:
      name: SignInCredentialIdentification
      in: path
      required: true
      x-sent-by: vendor
      description: A fleet's sign-in credential, by the id the middleware issued it.
      schema:
        type: string
        pattern: '^sic_[0-9a-f]{32}$'
    StoreIdentification:
      name: StoreIdentification
      in: path
      required: true
      x-sent-by: vendor
      description: A merchant store, by the id the middleware issued it.
      schema:
        type: string
        pattern: '^mst_[0-9a-f]{32}$'
    AliasIdentification:
      name: AliasIdentification
      in: path
      required: true
      x-sent-by: vendor
      description: An alias, by the id the middleware issued it.
      schema:
        type: string
        pattern: '^als_[0-9a-f]{32}$'
    TerminalId:
      name: POIIdentification
      in: path
      required: true
      x-sent-by: vendor
      description: A terminal, by the id the middleware issued it, or a seed chose for it.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,64}$'
    RegisterIdentification:
      name: RegisterIdentification
      in: path
      required: true
      x-sent-by: vendor
      description: A register, by the id the middleware issued it when it was listed.
      schema:
        type: string
        pattern: '^reg_[0-9a-f]{32}$'
  responses:
    Unauthorised:
      description: |
        The credential is missing or not acceptable, refused before the body is read or a key
        looked up, so this request did nothing and its refusal says nothing of a sale an earlier
        send made: if the request retried a sale whose answer was lost, fix the credential and send
        the sale again with the same `IdempotencyKey` from the same register, never a new one.

        - `certificate_required`: no credential came. A holder with no certificate for the
          route enrols first, with `POST /v1/enrol`.
        - `certificate_invalid`: an `Authorization` header of another scheme, a token of no
          form the middleware issues, two `Authorization` headers, a client certificate beside an
          `Authorization` header, or a client certificate no row holds.
        - `certificate_expired`: the client certificate is past its `NotAfter`. A holder that
          meets it re-enrols with a new code.
        - `sandbox_key_on_live`: a sandbox key sent to a `live` middleware, which refuses every
          one before any lookup.
        - `sandbox_key_invalid`: the sandbox key is malformed, unknown or retired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            certificate_required:
              value: {"Error": {"Code": "certificate_required", "Message": "This route needs a credential, and none came.", "Fields": []}}
            certificate_invalid:
              value: {"Error": {"Code": "certificate_invalid", "Message": "The credential presented is not acceptable.", "Fields": []}}
            sandbox_key_on_live:
              value: {"Error": {"Code": "sandbox_key_on_live", "Message": "A sandbox key is accepted in the sandbox alone.", "Fields": []}}
            sandbox_key_invalid:
              value: {"Error": {"Code": "sandbox_key_invalid", "Message": "The sandbox key is malformed, unknown or retired.", "Fields": []}}
            certificate_expired:
              value: {"Error": {"Code": "certificate_expired", "Message": "The certificate presented has expired.", "Fields": []}}
    NotPermitted:
      description: |
        Nothing was done.

        - `not_permitted`: the credential is good, and this route refuses it: a credential of a
          scope or a role the route does not take, `operator` asked for by anyone but the operator,
          a write by a suspended vendor, a role the vendor does not hold, a move the object's state
          does not allow, or an act held back from `onboarding`: a terminal's removal, or a code for
          a device that is not `listed`, has held a certificate or holds a binding. One code answers
          every reason.
        - `certificate_retired`: the client certificate presented is retired, because a newer one of
          the identity is in use. Retry on the newer one, and on the holder's newest, stop and tell
          a person: something else holds a newer certificate of this identity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_permitted:
              value: {"Error": {"Code": "not_permitted", "Message": "The caller is not permitted to do this.", "Fields": []}}
            certificate_retired:
              value: {"Error": {"Code": "certificate_retired", "Message": "The certificate presented is retired: a newer one of this identity is in use.", "Fields": []}}
    OperatorNotFound:
      description: >-
        `not_found`: no row holds this id, or the caller may not see it. The two answer the same, so a caller learns nothing of another vendor's objects.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_found:
              value: {"Error": {"Code": "not_found", "Message": "Nothing is served at this path.", "Fields": []}}
    OperatorBodyRefused:
      description: |
        The body is refused, and nothing was done.

        - `invalid_json`: the body is not a JSON object.
        - `unknown_field`: the body holds a field this operation does not name.
        - `missing_field`: a required field is absent.
        - `invalid_field`: a field breaks its rule, a required field sent as `null` included.
        - `body_unreadable`: the body could not be read to its end, such as a chunked body that
          breaks off. `Error.Fields` is empty.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_json:
              value: {"Error": {"Code": "invalid_json", "Message": "The body is not a JSON object.", "Fields": []}}
            unknown_field:
              value: {"Error": {"Code": "unknown_field", "Message": "The body holds a field the contract does not define.", "Fields": ["Note"]}}
            missing_field:
              value: {"Error": {"Code": "missing_field", "Message": "The body lacks a field the contract requires.", "Fields": ["SerialNumber"]}}
            invalid_field:
              value: {"Error": {"Code": "invalid_field", "Message": "A field does not meet its rule in the contract.", "Fields": ["Scope"]}}
            body_unreadable:
              value: {"Error": {"Code": "body_unreadable", "Message": "The body could not be read.", "Fields": []}}
    OperatorCreateBodyRefused:
      description: 'The body is refused, and nothing was done, as any Operator API body is; a vendor''s `admin` that sends no `IdempotencyKey` is answered `missing_field`, which names it.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_json:
              value: {"Error": {"Code": "invalid_json", "Message": "The body is not a JSON object.", "Fields": []}}
            unknown_field:
              value: {"Error": {"Code": "unknown_field", "Message": "The body holds a field the contract does not define.", "Fields": ["Note"]}}
            missing_field:
              value: {"Error": {"Code": "missing_field", "Message": "The body lacks a field the contract requires.", "Fields": ["IdempotencyKey"]}}
            invalid_field:
              value: {"Error": {"Code": "invalid_field", "Message": "A field does not meet its rule in the contract.", "Fields": ["IdempotencyKey"]}}
            body_unreadable:
              value: {"Error": {"Code": "body_unreadable", "Message": "The body could not be read.", "Fields": []}}
    PageQueryRefused:
      description: >-
        `invalid_query`: `page_size` is not a whole number from 1 to 100, or `page_after` is not of this list's `NextPage` form, or either is sent empty, with no `=` or twice. `Error.Fields` names each, and nothing was read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_query:
              value: {"Error": {"Code": "invalid_query", "Message": "A query parameter is malformed, out of its range, or given twice.", "Fields": ["page_after", "page_size"]}}
    OperatorBodyTooLarge:
      description: >-
        `body_too_large`: the body is over 65,536 bytes. Nothing was done, and no part of the body is logged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EdgeLengthRequired:
      description: 'Sent by the edge in front of a hosted middleware, never by the middleware itself, to a `POST` with no body and no `Content-Length` over HTTP/1.1: its body is the edge''s, not an `Error`, and nothing was read. Send the same request again with `Content-Length: 0`.'
    OperatorWriteRate:
      description: >-
        `write_rate`: the vendor's `admin` servers, which share one count, sent `MW_ADMIN_WRITES_PER_MINUTE` writes in the last 60 seconds, 60 unless set, and reads are not counted. Nothing was done: wait the seconds `Retry-After` gives, then send the same request again.
      headers:
        Retry-After:
          description: >-
            The whole seconds until the vendor's oldest counted write is 60 seconds old, from 1 to 60.
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            write_rate:
              value: {"Error": {"Code": "write_rate", "Message": "This vendor has sent as many writes as it may in the last minute. Retry after the seconds Retry-After gives.", "Fields": []}}
    OperatorStoreUnavailable:
      description: |
        No verdict on the caller.

        - `store_unavailable`: the middleware's store did not answer, while it looked up the
          credential or did the work. A write's commit may have landed with its answer lost,
          so read the object back before doing it again.
        - `edge_not_trusted`: behind the load balancer, the request did not come through a
          trusted edge. It is an edge fault, and the caller's certificate is not in
          question: retry on the normal backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            store_unavailable:
              value: {"Error": {"Code": "store_unavailable", "Message": "The store is not available. Retry.", "Fields": []}}
            edge_not_trusted:
              value: {"Error": {"Code": "edge_not_trusted", "Message": "The request did not come through a trusted edge. Retry.", "Fields": []}}
    SignInCredentialBodyRefused:
      description: |
        The body of a merchant's key pair is refused, and nothing was written.

        - `adapter_not_taken`: `Adapter` is the other environment's, or the body holds a `Secret`
          or a `SecretEncoding` where neither is taken. `Error.Fields` is empty, and the same body
          is refused the same way.
        - `invalid_json`: the body is not a JSON object.
        - `unknown_field`: the body holds a field this operation does not name, such as
          `ApplicationIdentification` or `Profile`, which the fleet's sign-in profile holds.
        - `missing_field`: a required field is absent, `Secret` or `SecretEncoding` with
          `signed_value` among them.
        - `invalid_field`: a field breaks its rule, a required field sent as `null` included, such
          as a `Secret` that does not decode by its `SecretEncoding` to 1 to 1,024 bytes.
          `Error.Fields` names the field, and never its value.
        - `body_unreadable`: the body could not be read to its end, such as a chunked body that
          breaks off. `Error.Fields` is empty.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            adapter_not_taken:
              value: {"Error": {"Code": "adapter_not_taken", "Message": "This environment does not take this adapter or Secret.", "Fields": []}}
            invalid_json:
              value: {"Error": {"Code": "invalid_json", "Message": "The body is not a JSON object.", "Fields": []}}
            unknown_field:
              value: {"Error": {"Code": "unknown_field", "Message": "The body holds a field the contract does not define.", "Fields": ["ApplicationIdentification", "Profile"]}}
            missing_field:
              value: {"Error": {"Code": "missing_field", "Message": "The body lacks a field the contract requires.", "Fields": ["Secret"]}}
            invalid_field:
              value: {"Error": {"Code": "invalid_field", "Message": "A field does not meet its rule in the contract.", "Fields": ["Secret"]}}
            body_unreadable:
              value: {"Error": {"Code": "body_unreadable", "Message": "The body could not be read.", "Fields": []}}
    SignInCredentialCreateBodyRefused:
      description: 'The body of a fleet''s sign-in credential is refused, and nothing was written, as `PUT` on a credential refuses one; a fleet''s `admin` that sends no `IdempotencyKey` is answered `missing_field`, which names it.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            adapter_not_taken:
              value: {"Error": {"Code": "adapter_not_taken", "Message": "This environment does not take this adapter or Secret.", "Fields": []}}
            invalid_json:
              value: {"Error": {"Code": "invalid_json", "Message": "The body is not a JSON object.", "Fields": []}}
            unknown_field:
              value: {"Error": {"Code": "unknown_field", "Message": "The body holds a field the contract does not define.", "Fields": ["ApplicationIdentification", "Profile"]}}
            missing_field:
              value: {"Error": {"Code": "missing_field", "Message": "The body lacks a field the contract requires.", "Fields": ["IdempotencyKey", "Secret"]}}
            invalid_field:
              value: {"Error": {"Code": "invalid_field", "Message": "A field does not meet its rule in the contract.", "Fields": ["Secret"]}}
            body_unreadable:
              value: {"Error": {"Code": "body_unreadable", "Message": "The body could not be read.", "Fields": []}}
    SignInCredentialSealUnavailable:
      description: |
        No verdict on the caller or the body.

        - `kms_unavailable`: the key service did not seal the `Secret`, and nothing was written: it
          was not reached, did not answer in time, refused, or gave an answer the middleware could
          not read. Retry on the normal backoff with the same body.
        - `store_unavailable`: the middleware's store did not answer, while it looked up the
          caller's credential or did the work. A write's commit may have landed with its answer
          lost, so send a create's body again under the same `IdempotencyKey`, or read the fleet's
          credentials, or its store's, back before doing it again.
        - `edge_not_trusted`: behind the load balancer, the request did not come through a trusted
          edge. It is an edge fault, and the caller's certificate is not in question: retry on the
          normal backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            kms_unavailable:
              value: {"Error": {"Code": "kms_unavailable", "Message": "The key service could not seal the secret. Retry.", "Fields": []}}
            store_unavailable:
              value: {"Error": {"Code": "store_unavailable", "Message": "The store is not available. Retry.", "Fields": []}}
            edge_not_trusted:
              value: {"Error": {"Code": "edge_not_trusted", "Message": "The request did not come through a trusted edge. Retry.", "Fields": []}}
    OperatorCreateStoreUnavailable:
      description: 'No verdict on the caller. `store_unavailable` means the store did not answer: a create sent under an `IdempotencyKey` is sent again under the same key, which answers `200` with the object if one was made and makes it if not, and one sent with no key, as the operator and `onboarding` may send it, may stand already, so look for it before sending it again; `edge_not_trusted` means the request did not come through a trusted edge, so retry on the normal backoff.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            store_unavailable:
              value: {"Error": {"Code": "store_unavailable", "Message": "The store is not available. Retry.", "Fields": []}}
            edge_not_trusted:
              value: {"Error": {"Code": "edge_not_trusted", "Message": "The request did not come through a trusted edge. Retry.", "Fields": []}}
  schemas:
    Error:
      type: object
      required: [Error]
      description: The body of every non-2xx answer the middleware gives. Every field is present.
      properties:
        Error:
          type: object
          required: [Code, Message, Fields]
          x-sent-by: mw
          description: What was refused, and why.
          properties:
            Code:
              type: string
              x-sent-by: mw
              description: The reason's code, one per case, named under its answer. Branch on this.
            Message:
              type: string
              x-sent-by: mw
              description: A fixed sentence per code for a person, holding nothing the request sent.
            Fields:
              type: array
              maxItems: 32
              items:
                type: string
              x-sent-by: mw
              description: >-
                The fields the refusal is about, sorted, at most 32, as paths such as `TransactionDetails.SaleItem[0].ProductDescription`, and empty when the refusal is about no field. A name the sender chose is shown as sent only when it has at most 64 characters, only ASCII letters, digits, `_`, `.` and `-`, and at most 2 digits, and as `<unprintable>` otherwise.
      examples:
        - {"Error": {"Code": "terminal_offline", "Message": "The terminal is not connected.", "Fields": []}}
    Health:
      type: object
      required: [Status, Version]
      description: Whether the middleware is serving.
      properties:
        Status:
          type: string
          x-sent-by: mw
          description: '`ok`.'
        Version:
          type: string
          x-sent-by: mw
          description: The release of the middleware answering, not this document's `info.version`.
      examples:
        - {"Status": "ok", "Version": "0.0.0"}
    IdempotencyKey:
      type: string
      pattern: '^[A-Za-z0-9._:/-]{8,64}$'
      description: 'A key the sender chooses for this create, held 24 hours for the caller''s vendor and this route, so a retry after a lost answer makes no second object: a vendor''s `admin` must send it, and the operator and `onboarding` may.'
    ServerListing:
      type: object
      additionalProperties: false
      required: [Scope]
      description: What `POST /v1/vendors/{VendorIdentification}/servers` takes.
      properties:
        Scope:
          type: string
          enum: [pos, admin, operator, onboarding]
          x-sent-by: vendor
          description: >-
            What the server's certificate will reach. Its vendor's roles must cover it, and `operator` and `onboarding` are the operator's alone, on its own vendor.
        IdempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
          x-sent-by: vendor
    AppIdentityRegistration:
      type: object
      additionalProperties: false
      required: [Role, AppPackage, SigningDigest]
      description: What `POST /v1/vendors/{VendorIdentification}/app-identities` takes.
      properties:
        Role:
          type: string
          enum: [terminal, register]
          x-sent-by: vendor
          description: Whether the app runs on a terminal or on a register.
        AppPackage:
          type: string
          maxLength: 128
          allOf:
            - pattern: '^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$'
            - pattern: '^[^0-9]*([0-9][^0-9]*){0,8}$'
          x-sent-by: vendor
          description: The app's Android package, such as `au.com.example.terminal`.
        SigningDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          x-sent-by: vendor
          description: The SHA-256 of the app's signing certificate, in lowercase hex.
        Debug:
          type: [boolean, 'null']
          x-sent-by: vendor
          description: Whether the app is a debug build, `false` unless sent.
        IdempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
          x-sent-by: vendor
    MerchantStoreCreation:
      type: object
      additionalProperties: false
      description: >-
        What `POST /v1/merchant-stores` takes: from a fleet vendor, its `IdempotencyKey` and, if it has one, its `AcceptorIdentification`. Only the operator and `onboarding` may send `OwnerVendor`, and from anyone else it is an unknown field.
      properties:
        OwnerVendor:
          type: [string, 'null']
          pattern: '^ven_[0-9a-f]{32}$'
          x-sent-by: vendor
          description: The fleet vendor owning the store, from the operator or `onboarding` alone.
        AcceptorIdentification:
          type: [string, 'null']
          pattern: '^[!-~]{1,140}$'
          x-sent-by: vendor
          description: >-
            The store's own number at its fleet's payment system, from any caller that may create a store. Absent or `null`: the store holds none.
        IdempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
          x-sent-by: vendor
    MerchantStoreAcceptor:
      type: object
      additionalProperties: false
      required: [AcceptorIdentification]
      description: What `PUT /v1/merchant-stores/{StoreIdentification}/acceptor` takes.
      properties:
        AcceptorIdentification:
          type: [string, 'null']
          pattern: '^[!-~]{1,140}$'
          x-sent-by: vendor
          description: The store's own number at its fleet's payment system. `null` clears it.
    MerchantStoreStateChange:
      type: object
      additionalProperties: false
      required: [Event]
      description: What `PUT /v1/merchant-stores/{StoreIdentification}/state` takes.
      properties:
        Event:
          type: string
          enum: [live, suspended, resumed, offboarded]
          x-sent-by: vendor
          description: The event to record, not the state to reach.
    AliasProposal:
      type: object
      additionalProperties: false
      required: [VendorIdentification, MerchantIdentification]
      description: What `POST /v1/merchant-stores/{StoreIdentification}/aliases` takes.
      properties:
        VendorIdentification:
          type: string
          pattern: '^ven_[0-9a-f]{32}$'
          x-sent-by: vendor
          description: The POS vendor the alias names.
        MerchantIdentification:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
          not:
            pattern: '^mid_'
          x-sent-by: vendor
          description: That vendor's own id for the store, its sales' `MerchantIdentification`.
    TerminalListing:
      type: object
      additionalProperties: false
      required: [SerialNumber]
      description: What `POST /v1/merchant-stores/{StoreIdentification}/terminals` takes.
      properties:
        SerialNumber:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
