openapi: '3.1.0'
info:
  title: 'Middleware v1.1.0: what a back office calls'
  version: '1.0.0'
  summary: The relay between a point of sale, a payment terminal and FUNDiMO.
  description: |-
    The routes a back office calls, from your own `admin` server: your vendor's own roles and state;
    your servers and your apps' identities; for a fleet vendor, its stores, the terminals at them and
    its sign-in at its payment system; for a POS vendor, its registers and the aliases a fleet proposes
    for its stores; enrolling for a certificate, its daily check and its renewal; and the health check.
    `/docs/api/back-office.md` walks a fleet's back office and a POS vendor's through them, and says
    how to try them in the sandbox. The sandbox passes them to your world's own `admin` server, whose
    code `POST /sandbox/v1/codes` gives for `{"Role":"admin"}`. Each property's `x-sent-by` names who
    sends it. `/docs/api/environments.md` names each environment's base URL. This release publishes
    this document as `openapi-admin.yaml`.

    Every property carries `x-sent-by`: `pos` for what a POS sends to the middleware, a register's
    request to link among it, `terminal` for what a terminal sends to the middleware, `vendor` for
    what a back office sends to the Operator API and what a vendor's app or server sends to enrol or
    renew a certificate, and `mw` for what the middleware sends to whoever is reading. A field that
    travels on, such as `TotalAmount`, is `pos` where it enters and `mw` where it leaves.

    `/docs/api/fields.json` holds a row for each field of a sale and of each frame, with its bound
    and an example. A field's name follows ISO 20022 where `fields.json` or `terminal.md` names its
    element; every other name is the middleware's own. A later version may add fields to anything
    the middleware sends, and codes to any open list. An optional field sent as `null` reads as
    absent. The normal backoff: wait 1 second, double the wait after each failure up to 30 seconds,
    and add a little randomness; a terminal resets it once a connection has stayed open 10 seconds.

    `info.version` counts this document's contract, not the middleware's release. Its major is the
    path family every path is under, `v1` in `/v1/`, and its minor and patch stay 0. It moves only
    when the middleware serves a new family of paths, so a field or a code a later release adds
    leaves it as it is. The release of the middleware answering is read at `GET /v1/health`, in its
    `Version`, and on the sandbox in its MCP server's `serverInfo.version`.

    Every operation but `GET /v1/health` and `POST /v1/enrol` needs a credential, the terminal's
    WebSocket upgrade among them, and no body or frame changes for it. A `live` middleware refuses
    every sandbox key with `401 sandbox_key_on_live`, before any lookup.

    The people who use a POS are the POS vendor's responsibility. The middleware takes it that a
    user was authenticated to make each sale and refund, and judges nothing about that user.

    A path not listed here answers `404` with `Error.Code` `not_found`. A listed path with another
    method answers `405` with `Error.Code` `method_not_allowed` and an `Allow` header naming the
    methods it takes. Both carry the `Error` body. A request too malformed to be read as HTTP at all
    is answered by the HTTP server library itself, with `400`, `414` or `431` and no `Error` body.
servers:
  - url: https://mw.sandbox.fundimo.com.au
    description: The sandbox
  - url: https://mw.staging.fundimo.com.au
    description: Staging
security:
  - mutualTLS: []
  - sandboxKey: []
tags:
  - name: servers
    description: 'Your vendor and its servers: read your vendor''s roles and state; list a second `admin` server or a `pos` one, read them, remove one, and list their certificates.'
  - name: app identities
    description: 'Your apps on a device: register one by its package and its signing certificate, read them, retire one, and read the operator''s list of the device models allowed for your vendor.'
  - name: stores
    description: 'A fleet''s stores: create one and read them; take one live, or suspend, resume or offboard it; set its number at your payment system and the POS vendors whose registers it accepts; and list the certificates of its terminals.'
  - name: store terminals
    description: 'A fleet''s terminals at its stores: list one and issue its pairing code, read a store''s terminals, issue one a fresh code or re-pair it, suspend, resume or remove one, end its binding to a register, and list its certificates.'
  - name: sign-in
    description: 'A fleet''s sign-in at its payment system: its profile, each merchant''s key pair, a store''s attachment to one, and a check of a store''s sign-in.'
  - name: registers
    description: 'Managing your registers: the routes your own `admin` server calls on your registers, from the Operator API.'
  - name: aliases
    description: 'A POS vendor''s own id for a fleet''s store: the fleet proposes one, and the POS vendor accepts or rejects it; each reads the aliases naming it.'
  - name: certificates
    description: >-
      A principal's client certificate: enrolment with a pairing code, the daily check, and renewal with a new key.
  - name: health
    description: Whether the middleware is serving.
paths:
  /v1/health:
    get:
      tags: [health]
      operationId: health
      summary: Whether the middleware is serving.
      security: []
      responses:
        '200':
          description: The middleware is serving.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  value: {"Status": "ok", "Version": "0.0.0"}
  /v1/vendors/{VendorIdentification}:
    parameters:
      - $ref: '#/components/parameters/VendorIdentification'
    get:
      tags: [servers]
      operationId: readVendor
      summary: Show a vendor's roles and state.
      description: The vendor's own `admin`, the operator, or `onboarding`. A suspended vendor reads itself too.
      responses:
        '200':
          description: The vendor as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor'
              examples:
                fleet:
                  summary: A fleet, active.
                  value: {"VendorIdentification": "ven_0123456789abcdef0123456789abcdef", "Roles": ["fleet"], "State": "active"}
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/vendors/{VendorIdentification}/servers:
    parameters:
      - $ref: '#/components/parameters/VendorIdentification'
    post:
      tags: [servers]
      operationId: listServer
      summary: List a vendor's server, and issue its code.
      description: >-
        The operator, or the vendor's own `admin`. Lists a server of `Scope` `pos`, `admin`, `operator` or `onboarding`, a scope the vendor's roles cover, and answers once with its `PairingCode`, for the server to enrol with at `POST /v1/enrol`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerListing'
      responses:
        '200':
          description: 'A replay of the same request under its `IdempotencyKey`: the server as its vendor''s listing shows it, with no `PairingCode`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '201':
          description: The server, `listed`, and its `PairingCode`, shown this once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerListed'
        '400':
          $ref: '#/components/responses/OperatorCreateBodyRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '409':
          description: >-
            `too_many_keys`: the vendor already holds two servers of this scope that are not removed. Remove one, then list the new one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                too_many_keys:
                  value: {"Error": {"Code": "too_many_keys", "Message": "The vendor already holds two servers of this scope.", "Fields": []}}
                idempotency_conflict:
                  value: {"Error": {"Code": "idempotency_conflict", "Message": "The idempotency key names a different request.", "Fields": []}}
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorCreateStoreUnavailable'
    get:
      tags: [servers]
      operationId: readServers
      summary: Show a vendor's servers.
      description: >-
        The operator, `onboarding`, or the vendor's own `admin`. Each server, with its state and, once it holds a certificate, its newest certificate's key digest and when it was first used, so a code spent by someone else is visible. Oldest first, a page at a time.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
      responses:
        '200':
          description: A page of the vendor's servers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerList'
        '400':
          $ref: '#/components/responses/PageQueryRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/vendors/{VendorIdentification}/servers/{ServerIdentification}:
    parameters:
      - $ref: '#/components/parameters/VendorIdentification'
      - $ref: '#/components/parameters/ServerIdentification'
    delete:
      tags: [servers]
      operationId: removeServer
      summary: Remove a vendor's server.
      description: >-
        The operator, or the vendor's own `admin`. The server goes `removed` and its certificates are retired. An `operator` or an `onboarding` server is removed by the operator alone.
      responses:
        '200':
          description: The server, `removed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/vendors/{VendorIdentification}/app-identities:
    parameters:
      - $ref: '#/components/parameters/VendorIdentification'
    post:
      tags: [app identities]
      operationId: registerAppIdentity
      summary: Register an app identity.
      description: >-
        The operator, or the vendor's own `admin`. Registers an app by `Role`, `AppPackage` and `SigningDigest`, the SHA-256 of its signing certificate, so a device running it can enrol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppIdentityRegistration'
      responses:
        '200':
          description: 'A replay of the same request under its `IdempotencyKey`: the app identity as it stands, `retired` if retired since.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppIdentity'
        '201':
          description: The app identity, `active`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppIdentity'
        '400':
          $ref: '#/components/responses/OperatorCreateBodyRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '409':
          description: '`idempotency_conflict`: the key names a different request, and nothing was written.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotency_conflict:
                  value: {"Error": {"Code": "idempotency_conflict", "Message": "The idempotency key names a different request.", "Fields": []}}
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorCreateStoreUnavailable'
    get:
      tags: [app identities]
      operationId: readAppIdentities
      summary: Show a vendor's app identities.
      description: The operator, `onboarding`, or the vendor's own `admin`. Every app identity of the vendor, `active` and `retired`, ordered by `AppIdentification`, each with who registered it.
      responses:
        '200':
          description: The app identities, `[]` where the vendor holds none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppIdentityList'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/vendors/{VendorIdentification}/app-identities/{AppIdentification}:
    parameters:
      - $ref: '#/components/parameters/VendorIdentification'
      - $ref: '#/components/parameters/AppIdentification'
    delete:
      tags: [app identities]
      operationId: retireAppIdentity
      summary: Retire an app identity.
      description: >-
        The operator, or the vendor's own `admin`. The app identity goes `retired`, and its row stays.
      responses:
        '204':
          description: Retired. No body.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/allowed-models:
    get:
      tags: [app identities]
      operationId: readAllowedModels
      summary: Show the allowed list.
      description: >-
        Any `admin`, the operator, or `onboarding`. An `admin` reads each row that applies to its vendor's devices: those naming no vendor, and its own vendor's. The operator and `onboarding` read every row.
      responses:
        '200':
          description: The rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedModelList'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/vendors/{VendorIdentification}/signin-credentials:
    parameters:
      - $ref: '#/components/parameters/VendorIdentification'
    post:
      tags: [sign-in]
      operationId: createSignInCredential
      summary: Set a fleet's sign-in credential.
      description: >-
        The fleet's own `admin`, or the operator. Sets a sign-in credential of a fleet vendor: a merchant's key pair at its payment system, which a terminal at a store it is attached to signs in with under the fleet's sign-in profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInCredentialCreation'
            examples:
              signed_value:
                summary: A merchant's key pair on a `live` middleware, its secret written as text.
                value: {"IdempotencyKey": "credential-create-01", "Adapter": "signed_value", "KeyIdentification": "key-example-1", "Secret": "…", "SecretEncoding": "text"}
              sandbox_signed_value:
                summary: A credential in a sandbox, which holds no secret.
                value: {"IdempotencyKey": "credential-create-02", "Adapter": "sandbox_signed_value", "KeyIdentification": "sandbox-key-1"}
      responses:
        '200':
          description: 'A replay of the same request under its `IdempotencyKey`: the credential as it stands, `removed` if removed since. It holds no `Secret`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInCredential'
        '201':
          description: The credential, `active` and attached to no store. It holds no `Secret`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInCredential'
              examples:
                created:
                  summary: A merchant's key pair just set.
                  value: {"SignInCredentialIdentification": "sic_0123456789abcdef0123456789abcdef", "VendorIdentification": "ven_0123456789abcdef0123456789abcdef", "Adapter": "signed_value", "KeyIdentification": "key-example-1", "State": "active", "CreatedAt": "2026-11-20T09:00:00Z", "ReplacedAt": null, "RemovedAt": null, "Stores": [], "CreatedBy": {"VendorIdentification": "ven_0123456789abcdef0123456789abcdef", "Scope": "admin", "ServerIdentification": null}}
        '400':
          $ref: '#/components/responses/SignInCredentialCreateBodyRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '409':
          description: |
            Nothing was sealed or written.

            - `signin_profile_not_set`: the fleet holds no sign-in profile. Set it with `PUT
              /v1/vendors/{VendorIdentification}/signin-profile`, then send the same request.
            - `sign_in_not_configured`: sign-in is off on this `live` middleware, so it holds no
              key to seal a `Secret` under. The same request is refused the same way until the
              operator turns sign-in on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                signin_profile_not_set:
                  value: {"Error": {"Code": "signin_profile_not_set", "Message": "The fleet holds no sign-in profile: set it first.", "Fields": []}}
                sign_in_not_configured:
                  value: {"Error": {"Code": "sign_in_not_configured", "Message": "Sign-in is not configured on this middleware.", "Fields": []}}
                idempotency_conflict:
                  value: {"Error": {"Code": "idempotency_conflict", "Message": "The idempotency key names a different request.", "Fields": []}}
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/SignInCredentialSealUnavailable'
    get:
      tags: [sign-in]
      operationId: readSignInCredentials
      summary: Show a fleet's sign-in credentials.
      description: >-
        The fleet's own `admin`, the operator, or `onboarding`. Each of the vendor's sign-in credentials, `active` and `removed`, ordered by `CreatedAt`, then `SignInCredentialIdentification`, each with the stores it is attached to now, a page at a time.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
      responses:
        '200':
          description: A page of the vendor's credentials, `[]` where it holds none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInCredentials'
              examples:
                one_replaced:
                  summary: A fleet's one credential, replaced once and attached to two stores.
                  value: {"SignInCredentials": [{"SignInCredentialIdentification": "sic_0123456789abcdef0123456789abcdef", "VendorIdentification": "ven_0123456789abcdef0123456789abcdef", "Adapter": "signed_value", "KeyIdentification": "key-example-2", "State": "active", "CreatedAt": "2026-11-20T09:00:00Z", "ReplacedAt": "2026-11-27T09:00:00Z", "RemovedAt": null, "Stores": ["mst_0123456789abcdef0123456789abcdef", "mst_0123456789abcdef0123456789abcdf0"], "CreatedBy": {"VendorIdentification": "ven_0123456789abcdef0123456789abcdef", "Scope": "admin", "ServerIdentification": null}}], "NextPage": null}
        '400':
          $ref: '#/components/responses/PageQueryRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/vendors/{VendorIdentification}/signin-credentials/{SignInCredentialIdentification}:
    parameters:
      - $ref: '#/components/parameters/VendorIdentification'
      - $ref: '#/components/parameters/SignInCredentialIdentification'
    put:
      tags: [sign-in]
      operationId: replaceSignInCredential
      summary: Replace a fleet's sign-in credential.
      description: >-
        The fleet's own `admin`, or the operator. Replaces the credential's `KeyIdentification` and `Secret` together, in one write, from a body that `POST /v1/vendors/{VendorIdentification}/signin-credentials` would take: how a fleet rotates a merchant's key pair. The body's `SecretEncoding` says how its `Secret` is written, and is read once to decode it and never kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInCredentialRequest'
            examples:
              new_key:
                summary: The merchant's new key pair, its secret written as text.
                value: {"Adapter": "signed_value", "KeyIdentification": "key-example-2", "Secret": "…", "SecretEncoding": "text"}
      responses:
        '200':
          description: The credential, `ReplacedAt` set and every store still attached. No `Secret`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInCredential'
        '400':
          $ref: '#/components/responses/SignInCredentialBodyRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '409':
          description: |
            Nothing was written.

            - `signin_credential_removed`: the credential is removed, and a removed credential
              stays removed. Set a new one with
              `POST /v1/vendors/{VendorIdentification}/signin-credentials` and attach it.
            - `sign_in_not_configured`: sign-in is off on this `live` middleware, so it holds no
              key to seal a `Secret` under. The same request is refused the same way until the
              operator turns sign-in on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                signin_credential_removed:
                  value: {"Error": {"Code": "signin_credential_removed", "Message": "The sign-in credential is removed.", "Fields": []}}
                sign_in_not_configured:
                  value: {"Error": {"Code": "sign_in_not_configured", "Message": "Sign-in is not configured on this middleware.", "Fields": []}}
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/SignInCredentialSealUnavailable'
    delete:
      tags: [sign-in]
      operationId: removeSignInCredential
      summary: Remove a fleet's sign-in credential.
      description: >-
        The fleet's own `admin`, or the operator. The credential goes `removed`, its sealed `Secret` erased from its row and every store's attachment of it ended, in one transaction.
      responses:
        '204':
          description: Removed, or it was already. No body.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/vendors/{VendorIdentification}/signin-profile:
    parameters:
      - $ref: '#/components/parameters/VendorIdentification'
    put:
      tags: [sign-in]
      operationId: setFleetSignInProfile
      summary: Set a fleet's sign-in profile.
      description: >-
        The fleet's own `admin`, or the operator. Sets the fleet's sign-in profile whole, or replaces it: its application key, and how a signed value is made for each of its stores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FleetSignInProfileRequest'
            examples:
              uuid_challenge:
                summary: A fleet's application key, and a 16-byte challenge written as a UUID.
                value: {"ApplicationIdentification": "app-example-1", "Profile": {"Algorithm": "HMAC-SHA256", "ChallengeLength": 16, "ChallengeEncoding": "uuid", "SignatureEncoding": "hex"}}
              no_application_key:
                summary: A fleet whose payment system takes no application key.
                value: {"ApplicationIdentification": null, "Profile": {"Algorithm": "HMAC-SHA256", "ChallengeLength": 32, "ChallengeEncoding": "hex", "SignatureEncoding": "base64"}}
      responses:
        '200':
          description: The fleet's sign-in profile, as it now holds it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetSignInProfile'
              examples:
                first_set:
                  summary: A fleet's first sign-in profile, never changed.
                  value: {"VendorIdentification": "ven_0123456789abcdef0123456789abcdef", "ApplicationIdentification": "app-example-1", "Profile": {"Algorithm": "HMAC-SHA256", "ChallengeLength": 16, "ChallengeEncoding": "uuid", "SignatureEncoding": "hex"}, "SetAt": "2026-11-20T09:00:00Z", "ChangedAt": null}
        '400':
          $ref: '#/components/responses/OperatorBodyRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
    get:
      tags: [sign-in]
      operationId: readFleetSignInProfile
      summary: Show a fleet's sign-in profile.
      description: >-
        The fleet's own `admin`, the operator, or `onboarding`. The fleet's sign-in profile, each value but `VendorIdentification` `null` where none is set.
      responses:
        '200':
          description: The fleet's sign-in profile, set or not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetSignInProfile'
              examples:
                changed:
                  summary: A fleet's sign-in profile, changed once.
                  value: {"VendorIdentification": "ven_0123456789abcdef0123456789abcdef", "ApplicationIdentification": "app-example-1", "Profile": {"Algorithm": "HMAC-SHA256", "ChallengeLength": 16, "ChallengeEncoding": "uuid", "SignatureEncoding": "hex"}, "SetAt": "2026-11-20T09:00:00Z", "ChangedAt": "2026-11-27T09:00:00Z"}
                none_set:
                  summary: A fleet that holds no sign-in profile.
                  value: {"VendorIdentification": "ven_0123456789abcdef0123456789abcdef", "ApplicationIdentification": null, "Profile": null, "SetAt": null, "ChangedAt": null}
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/merchant-stores:
    post:
      tags: [stores]
      operationId: createMerchantStore
      summary: Create a merchant store.
      description: >-
        A fleet vendor's `admin`, the operator, or `onboarding`. The store's owner is the caller's vendor, and only the operator and `onboarding` name another, as `OwnerVendor`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantStoreCreation'
      responses:
        '200':
          description: 'A replay of the same request under its `IdempotencyKey`: the store as the caller''s listing shows it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantStore'
        '201':
          description: The store, `onboarding`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantStore'
        '400':
          $ref: '#/components/responses/OperatorCreateBodyRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '409':
          description: '`idempotency_conflict`: the key names a different request, and nothing was written.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotency_conflict:
                  value: {"Error": {"Code": "idempotency_conflict", "Message": "The idempotency key names a different request.", "Fields": []}}
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorCreateStoreUnavailable'
    get:
      tags: [stores]
      operationId: readMerchantStores
      summary: Show the caller's merchant stores.
      description: >-
        A fleet vendor's `admin`, the operator, or `onboarding`. An `admin` sees its own stores, each with its `MerchantIdentification`, and the operator and `onboarding` see every store. By `StoreIdentification`, a page at a time.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
      responses:
        '200':
          description: A page of the stores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantStoreList'
        '400':
          $ref: '#/components/responses/PageQueryRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/merchant-stores/{StoreIdentification}/state:
    parameters:
      - $ref: '#/components/parameters/StoreIdentification'
    put:
      tags: [stores]
      operationId: moveMerchantStore
      summary: Take a store live, or suspend, resume or offboard it.
      description: >-
        The store's owner, the operator, or `onboarding`. `Event` names the event to record: `live` from the state `onboarding` or `offboarded`, `suspended` from `live`, `resumed` from `suspended`, and `offboarded` from `live` or `suspended`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantStoreStateChange'
      responses:
        '200':
          description: The store as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantStore'
        '400':
          $ref: '#/components/responses/OperatorBodyRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/merchant-stores/{StoreIdentification}/acceptor:
    parameters:
      - $ref: '#/components/parameters/StoreIdentification'
    put:
      tags: [stores]
      operationId: setMerchantStoreAcceptor
      summary: Set or clear a store's number at its fleet's payment system.
      description: >-
        The store's owner, the operator, or `onboarding`. Sets the store's `AcceptorIdentification`, its own number at its fleet's payment system, which a terminal's sign-in carries, or with `null` clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantStoreAcceptor'
      responses:
        '200':
          description: The store as it now stands, holding the number, or none after a clear.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantStore'
        '400':
          $ref: '#/components/responses/OperatorBodyRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/merchant-stores/{StoreIdentification}/aliases:
    parameters:
      - $ref: '#/components/parameters/StoreIdentification'
    post:
      tags: [aliases]
      operationId: proposeAlias
      summary: Propose a POS vendor's merchant id for a store.
      description: >-
        The store's owner, or the operator. Proposes `MerchantIdentification` as the vendor `VendorIdentification`'s own id for this store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasProposal'
      responses:
        '201':
          description: The alias, `proposed`, or `accepted` where the owner named itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alias'
        '400':
          $ref: '#/components/responses/OperatorBodyRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '409':
          description: >-
            `alias_taken`, where the owner named itself: its own `MerchantIdentification` already names another store, as an accepted alias, so choose another id for this store. A proposal naming another vendor is never refused for it: that vendor's accept is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alias_taken:
                  value: {"Error": {"Code": "alias_taken", "Message": "The vendor's merchant id already names another store.", "Fields": []}}
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/aliases:
    get:
      tags: [aliases]
      operationId: readAliases
      summary: Show the aliases naming the caller.
      description: >-
        The named vendor's `admin`: the open proposals that name its vendor, oldest first, so it can accept or reject each. The operator sees every vendor's. A proposal is open for 14 days, and the list is read a page at a time.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
      responses:
        '200':
          description: A page of the aliases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AliasList'
        '400':
          $ref: '#/components/responses/PageQueryRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/aliases/{AliasIdentification}/accept:
    parameters:
      - $ref: '#/components/parameters/AliasIdentification'
    post:
      tags: [aliases]
      operationId: acceptAlias
      summary: Accept a proposed alias.
      description: >-
        The vendor the alias names, or the operator. From then on a sale of that vendor's may name the store by this `MerchantIdentification`. An id the vendor holds for another store is `409 alias_taken`.
      responses:
        '200':
          description: The alias, `accepted`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alias'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '409':
          description: >-
            `alias_taken`: that vendor's `MerchantIdentification` already names another store, as an accepted alias. Reject this proposal, and have the store's owner propose another id for this store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alias_taken:
                  value: {"Error": {"Code": "alias_taken", "Message": "The vendor's merchant id already names another store.", "Fields": []}}
        '411': {$ref: '#/components/responses/EdgeLengthRequired'}
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/aliases/{AliasIdentification}/reject:
    parameters:
      - $ref: '#/components/parameters/AliasIdentification'
    post:
      tags: [aliases]
      operationId: rejectAlias
      summary: Reject a proposed alias.
      description: The vendor the alias names, or the operator. The alias goes `rejected` and stays.
      responses:
        '200':
          description: The alias, `rejected`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alias'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '411': {$ref: '#/components/responses/EdgeLengthRequired'}
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/merchant-stores/{StoreIdentification}/terminals:
    parameters:
      - $ref: '#/components/parameters/StoreIdentification'
    post:
      tags: [store terminals]
      operationId: listTerminal
      summary: List a terminal at a store, and issue its code.
      description: The store's owner, the operator, or `onboarding`. Lists a device by its serial.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalListing'
      responses:
        '200':
          description: 'A replay of the same request under its `IdempotencyKey`: the terminal as its store''s listing shows it, with no `PairingCode`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terminal'
        '201':
          description: The terminal, `listed`, and its `PairingCode`, shown this once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalListed'
        '400':
          $ref: '#/components/responses/OperatorCreateBodyRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '409':
          description: >-
            `serial_taken`: the fleet already lists a device of this `SerialNumber` that is not removed. Use the terminal listed, or remove it and list the device again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                serial_taken:
                  value: {"Error": {"Code": "serial_taken", "Message": "The fleet already lists a device of this serial.", "Fields": []}}
                idempotency_conflict:
                  value: {"Error": {"Code": "idempotency_conflict", "Message": "The idempotency key names a different request.", "Fields": []}}
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorCreateStoreUnavailable'
    get:
      tags: [store terminals]
      operationId: readTerminals
      summary: Show a store's terminals.
      description: >-
        The store's owner, the operator, or `onboarding`. Each terminal with its state, its newest certificate's `NotAfter`, and the register and vendor bound to it, so a binding the owner never made is visible. By `POIIdentification`, in byte order, a page at a time.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
      responses:
        '200':
          description: A page of the store's terminals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalList'
        '400':
          $ref: '#/components/responses/PageQueryRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/terminals/{POIIdentification}/pairing-code:
    parameters:
      - $ref: '#/components/parameters/TerminalId'
    post:
      tags: [store terminals]
      operationId: issueTerminalPairingCode
      summary: Issue a terminal a fresh code, or re-pair it.
      description: >-
        The terminal's owner, the operator, or `onboarding`. On a `listed` terminal, a fresh code in place of the old one, and on a `paired` terminal a re-pair. To `onboarding` this route gives a first code alone: a code for a terminal `listed` that has never held a certificate and holds no binding, and `403 not_permitted` for any other, with nothing written.
      responses:
        '201':
          description: The terminal, `listed`, and its new `PairingCode`, shown this once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalListed'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '411': {$ref: '#/components/responses/EdgeLengthRequired'}
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/terminals/{POIIdentification}/state:
    parameters:
      - $ref: '#/components/parameters/TerminalId'
    put:
      tags: [store terminals]
      operationId: moveTerminal
      summary: Suspend, resume or remove a terminal.
      description: >-
        The terminal's owner, the operator, or `onboarding`. `onboarding` may suspend and resume a terminal, and its ask for `removed` is `403 not_permitted` whatever the terminal's state, with nothing written, since `removed` has no exit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalStateChange'
      responses:
        '204':
          description: Moved. No body.
        '400':
          $ref: '#/components/responses/OperatorBodyRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/registers:
    post:
      tags: [registers]
      operationId: listRegister
      summary: List a register.
      description: >-
        A POS vendor's `admin`, the operator, or `onboarding`. With `SerialNumber` it is a device's register: it starts `listed`, and the middleware answers once with its `PairingCode`, five words. With none it is a server's register, which starts `active` and has no code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterListing'
      responses:
        '200':
          description: 'A replay of the same request under its `IdempotencyKey`: the register as `GET /v1/registers` shows it, with no `PairingCode`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
        '201':
          description: The register, and a device's `PairingCode`, shown this once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterListed'
        '400':
          $ref: '#/components/responses/OperatorCreateBodyRefused'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '409':
          description: '`idempotency_conflict`: the key names a different request, and nothing was written.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                idempotency_conflict:
                  value: {"Error": {"Code": "idempotency_conflict", "Message": "The idempotency key names a different request.", "Fields": []}}
        '413':
          $ref: '#/components/responses/OperatorBodyTooLarge'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorCreateStoreUnavailable'
    get:
      tags: [registers]
      operationId: readRegisters
      summary: Show the caller's registers.
      description: >-
        A POS vendor's `admin`, the operator, or `onboarding`. An `admin` sees its own registers, and the operator and `onboarding` every vendor's, a removed one among them, each with its vendor, its kind, its state, a device's serial, the store it sits at and, once it has held a certificate, its newest certificate's `NotAfter`. Never a code.
      responses:
        '200':
          description: The registers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterList'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/registers/{RegisterIdentification}:
    parameters:
      - $ref: '#/components/parameters/RegisterIdentification'
    delete:
      tags: [registers]
      operationId: removeRegister
      summary: Remove a register.
      description: >-
        Its vendor's `admin`, or the operator. The register goes `removed`, each of its bindings ends, its code is cleared and its certificates are retired. No other caller removes a register: `removed` has no exit.
      responses:
        '200':
          description: The register, `removed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/registers/{RegisterIdentification}/pairing-code:
    parameters:
      - $ref: '#/components/parameters/RegisterIdentification'
    post:
      tags: [registers]
      operationId: issueRegisterPairingCode
      summary: Issue a register a fresh code, or re-pair it.
      description: >-
        Its vendor's `admin`, the operator, or `onboarding`, for a device's register. A fresh code, or on an `active` register a re-pair, as a terminal's. To `onboarding` this route gives a first code alone: a code for a register `listed` that has never held a certificate and holds no binding, and `403 not_permitted` for any other, with nothing written.
      responses:
        '201':
          description: The register and its new `PairingCode`, shown this once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterListed'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/NotPermitted'
        '404':
          $ref: '#/components/responses/OperatorNotFound'
        '411': {$ref: '#/components/responses/EdgeLengthRequired'}
        '429': {$ref: '#/components/responses/OperatorWriteRate'}
        '503':
          $ref: '#/components/responses/OperatorStoreUnavailable'
  /v1/merchant-stores/{StoreIdentification}/accepted-vendors:
    parameters:
      - $ref: '#/components/parameters/StoreIdentification'
    put:
      tags: [stores]
      operationId: setAcceptedVendors
      summary: Say which vendors' registers a store accepts.
      description: >-
        The store's owner, the operator, or `onboarding`. `AcceptsAnyVendor` `true` accepts the register of any onboarded vendor, an `active` vendor holding `pos` whose register holds a certificate, which is how every store starts.
