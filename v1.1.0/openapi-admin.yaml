        KeyIdentification:
          type: string
          pattern: '^[!-~]{1,140}$'
          x-sent-by: vendor
          description: The access key id, the public half of the merchant's key pair, whose other half is `Secret`.
        Secret:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2048
          x-sent-by: vendor
