        AttestationChain:
          type: [string, 'null']
          maxLength: 49152
          x-sent-by: vendor
          description: >-
            A device's Android Key Attestation chain for the new key, made with the challenge of `POST /v1/certificates/challenge`, in PEM, leaf first.
