    parameters:
      - $ref: '#/components/parameters/StoreIdentification'
    put:
      tags: [sign-in]
      operationId: setStoreSignInCredential
      summary: Attach a fleet's sign-in credential to a store.
      description: >-
        The `admin` of the store's owner, or the operator. Attaches the credential `SignInCredentialIdentification` names, an `active` one of the store's owner, to the store, ending the one it held: the credential the store's terminals are signed in with, each on its `TerminalLoginNeeded` on a connection that declared `SASQ`.
      requestBody:
        required: true
        content:
          application/json:
