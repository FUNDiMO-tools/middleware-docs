    DeviceAttestation:
      type: object
      required: [State, FailedChecks, Since]
      description: >-
        A device's attestation mark, which is its newest certificate's: the middleware issued that certificate though the device's key attestation failed the checks `FailedChecks` lists.
      properties:
        State:
          type: string
          anyOf:
            - enum: [failed]
            - type: string
          x-sent-by: mw
          description: >-
            `failed`, the one value today: the key attestation failed, and the middleware admitted the device all the same. Read a `State` you do not know as not attested by Google.
        FailedChecks:
          type: array
          minItems: 1
          items:
            type: string
            enum: [chain_missing, chain, root, dates, revoked, hardware, boot, app_debug, model]
          x-sent-by: mw
          description: |
            The checks the newest certificate's key attestation failed, at least one, each once, in
            the order the middleware runs them:

            - `chain_missing`: the device sent no chain, and it stands alone.
            - `chain`: the chain holds fewer than three certificates, does not end in a self-issued
              one, or holds one not signed by the next, and `root` comes with it.
            - `root`: the chain does not end at one of Google's two attestation roots.
            - `dates`: a certificate of the chain is outside its dates.
            - `revoked`: a certificate of the chain is revoked or suspended.
            - `hardware`: the key was not made in the trusted environment or StrongBox, or is not a
              P-256 key for signing.
            - `boot`: the bootloader is not locked, or the boot not verified.
            - `app_debug`: the app is registered for its vendor and role as a debug build alone.
            - `model`: no row of the allowed list admits what the device attests.
        Since:
          type: string
          x-sent-by: mw
          description: >-
            When the device's current unbroken run of failed certificates began, in RFC 3339 and UTC: the `IssuedAt` of the run's first certificate.
