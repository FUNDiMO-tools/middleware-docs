        A fleet's sign-in profile, as `PUT` and `GET` on `/v1/vendors/{VendorIdentification}/signin-profile` answer it. Every key is always present, each value but `VendorIdentification` `null` where no sign-in profile is set.
      properties:
        VendorIdentification:
          type: string
          pattern: '^ven_[0-9a-f]{32}$'
          x-sent-by: mw
          description: The fleet vendor whose sign-in profile it is.
        ApplicationIdentification:
          type: [string, 'null']
          pattern: '^[!-~]{1,140}$'
          x-sent-by: mw
          description: The fleet's application key at its payment system, or `null` where it holds none.
        Profile:
          anyOf:
            - $ref: '#/components/schemas/SignInProfile'
            - type: 'null'
          x-sent-by: mw
          description: How a signed value is made, or `null` where none is set.
        SetAt:
          type: [string, 'null']
          x-sent-by: mw
          description: When it was first set, in RFC 3339 and UTC, or `null` where none is set.
        ChangedAt:
          type: [string, 'null']
          x-sent-by: mw
          description: When it was last changed, in RFC 3339 and UTC, and `null` until it is.
    SignInProfile:
      type: object
      required: [Algorithm, ChallengeLength, ChallengeEncoding, SignatureEncoding]
      if:
        properties:
          ChallengeEncoding:
            const: uuid
        required: [ChallengeEncoding]
      then:
        properties:
          ChallengeLength:
            const: 16
      description: >-
        How a signed value is made, as the fleet's payment system checks it: a challenge of `ChallengeLength` random bytes, written in `ChallengeEncoding`, and its MAC by `Algorithm`, keyed with the secret's bytes and written in `SignatureEncoding`.
      properties:
        Algorithm:
          type: string
          enum: [HMAC-SHA256, HMAC-SHA384, HMAC-SHA512]
          x-sent-by: vendor
          description: The MAC a signed value is, keyed with the secret's bytes.
        ChallengeLength:
          type: integer
          minimum: 16
          maximum: 64
          x-sent-by: vendor
          description: How many random bytes a challenge holds, 16 to 64, and 16 with `uuid`.
        ChallengeEncoding:
          type: string
          enum: [hex, base64url, uuid]
          x-sent-by: vendor
          description: >-
            How a challenge's bytes are written: `hex` in lowercase, `base64url` unpadded, or `uuid`, the 16 bytes as a version 4 UUID's 36-character lowercase text, its version and variant bits set over them. With `uuid`, `ChallengeLength` is 16.
        SignatureEncoding:
          type: string
          enum: [hex, base64, base64url]
          x-sent-by: vendor
          description: >-
            How a signature's bytes are written, `hex` in lowercase, `base64` standard and padded, or `base64url` unpadded.
    SignInCredentialCreation:
      type: object
      additionalProperties: false
      required: [Adapter, KeyIdentification]
      if:
        properties:
          Adapter:
            const: signed_value
        required: [Adapter]
      then:
        required: [Secret, SecretEncoding]
        properties:
          Secret:
            type: string
      else:
        not:
          anyOf:
            - required: [Secret]
            - required: [SecretEncoding]
      description: 'What `POST /v1/vendors/{VendorIdentification}/signin-credentials` takes: a merchant''s key pair as `PUT` on a credential takes it, `Secret` and `SecretEncoding` with `signed_value` alone, and its `IdempotencyKey`.'
      properties:
        Adapter:
          type: string
          enum: [signed_value, sandbox_signed_value]
          x-sent-by: vendor
          description: How the credential signs the answer to a terminal's `TerminalLoginNeeded`.
        KeyIdentification:
          type: string
          pattern: '^[!-~]{1,140}$'
          x-sent-by: vendor
          description: 'The access key id: the public half of the merchant''s key pair at its fleet''s payment system, whose other half is `Secret`.'
        Secret:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2048
          x-sent-by: vendor
          description: 'The key pair''s secret, written as `SecretEncoding` says, which must decode to 1 to 1,024 bytes, so it is at most 2,048 characters.'
        SecretEncoding:
          type: string
          enum: [text, hex, base64]
          x-sent-by: vendor
          description: 'How `Secret` is written: `text`, the string''s UTF-8 bytes; `hex`, pairs of hex digits, either case; or `base64`, standard and padded.'
        IdempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
          x-sent-by: vendor
    SignInCredentialRequest:
      type: object
      additionalProperties: false
      required: [Adapter, KeyIdentification]
      if:
        properties:
          Adapter:
            const: signed_value
        required: [Adapter]
      then:
        required: [Secret, SecretEncoding]
        properties:
          Secret:
            type: string
      else:
        not:
          anyOf:
            - required: [Secret]
            - required: [SecretEncoding]
      description: >-
        A merchant's key pair at its fleet's payment system, as `PUT` on a fleet's sign-in credential takes it, and its create beside an `IdempotencyKey`. `Secret` and `SecretEncoding` are required with `signed_value`, and absent with `sandbox_signed_value`.
      properties:
        Adapter:
          type: string
          enum: [signed_value, sandbox_signed_value]
          x-sent-by: vendor
          description: How the credential signs the answer to a terminal's `TerminalLoginNeeded`.
        KeyIdentification:
          type: string
          pattern: '^[!-~]{1,140}$'
          x-sent-by: vendor
          description: >-
            The access key id: the public half of the merchant's key pair at its fleet's payment system, whose other half is `Secret`. A fleet may call it an access key id or an API access key.
        Secret:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2048
          x-sent-by: vendor
          description: >-
            The key pair's secret, written as `SecretEncoding` says, which must decode to 1 to 1,024 bytes, so it is at most 2,048 characters. Required with `signed_value`, and never sent with `sandbox_signed_value`: a sandbox refuses one, even `null` or empty, `400 adapter_not_taken`.
        SecretEncoding:
          type: string
          enum: [text, hex, base64]
          x-sent-by: vendor
          description: >-
            How `Secret` is written: `text`, the string's UTF-8 bytes; `hex`, pairs of hex digits, either case; or `base64`, standard and padded. Read once, to decode `Secret`, never stored and never answered.
    SignInCredential:
      type: object
      required: [SignInCredentialIdentification, VendorIdentification, Adapter, KeyIdentification, State, CreatedAt, ReplacedAt, RemovedAt, Stores, CreatedBy]
      description: >-
        A fleet's sign-in credential, as its routes answer it: a merchant's key pair, less its secret. Every field is always present, `ReplacedAt` and `RemovedAt` `null` until set.
      properties:
        SignInCredentialIdentification:
          type: string
          pattern: '^sic_[0-9a-f]{32}$'
          x-sent-by: mw
          description: The credential's id, `sic_` then 32 lowercase hex characters, issued by the middleware.
        VendorIdentification:
          type: string
          pattern: '^ven_[0-9a-f]{32}$'
          x-sent-by: mw
          description: The fleet vendor whose credential it is.
        Adapter:
          type: string
          enum: [signed_value, sandbox_signed_value]
          x-sent-by: mw
          description: >-
            How it signs, for a terminal's sign-in, the answer to its `TerminalLoginNeeded`: `signed_value` with the fleet's sealed secret, or `sandbox_signed_value`, a sandbox's stand-in that holds no secret.
        KeyIdentification:
          type: string
          pattern: '^[!-~]{1,140}$'
          x-sent-by: mw
          description: The access key id, the public half of the merchant's key pair, whose secret is never answered.
        State:
          type: string
          enum: [active, removed]
          x-sent-by: mw
          description: >-
            `active`, or `removed`, which erased its sealed secret and ended every store's attachment of it.
        CreatedAt:
          type: string
          x-sent-by: mw
          description: When it was set, in RFC 3339 and UTC.
        ReplacedAt:
          type: [string, 'null']
          x-sent-by: mw
          description: When it was last replaced, in RFC 3339 and UTC, and `null` until it is.
        RemovedAt:
          type: [string, 'null']
          x-sent-by: mw
          description: When it was removed, in RFC 3339 and UTC, and `null` while it is `active`.
        Stores:
          type: array
          items:
            type: string
            pattern: '^mst_[0-9a-f]{32}$'
          x-sent-by: mw
          description: >-
            The stores it is attached to now, by `StoreIdentification`, in byte order: `[]` where none is, and always once it is removed.
        CreatedBy:
          anyOf:
            - $ref: '#/components/schemas/Actor'
            - type: 'null'
          x-sent-by: mw
          description: Who made it, or `null` where the middleware holds no record of who did.
    SignInCredentials:
      type: object
      required: [SignInCredentials, NextPage]
      description: >-
        A page of a fleet's sign-in credentials, as `GET /v1/vendors/{VendorIdentification}/signin-credentials` answers.
      properties:
        SignInCredentials:
          type: array
          items:
            $ref: '#/components/schemas/SignInCredential'
          x-sent-by: mw
          description: The page's credentials, `removed` included, by `CreatedAt` and then by its id.
        NextPage:
          type: [string, 'null']
          x-sent-by: mw
          description: >-
            The cursor to the page after this one: send it back unchanged as `page_after`; always present, `null` on the last page.
    StoreSignInRequest:
      type: object
      additionalProperties: false
      required: [SignInCredentialIdentification]
      description: What `PUT /v1/merchant-stores/{StoreIdentification}/signin-credential` takes.
      properties:
        SignInCredentialIdentification:
          type: string
          pattern: '^sic_[0-9a-f]{32}$'
          x-sent-by: vendor
          description: The credential to attach, an `active` one of the store's owner.
        UserName:
          type: [string, 'null']
          pattern: '^[!-~]{1,140}$'
          x-sent-by: vendor
          description: >-
            The merchant user the store signs in as at its fleet's payment system: 1 to 140 printable ASCII characters with no space. Absent, it keeps the name the store's attachment holds, `null` clears it, and a value sets it.
    StoreSignIn:
      type: object
      required: [StoreIdentification, SignInCredentialIdentification]
      description: >-
        A store's sign-in credential, as `PUT` and `GET` on `/v1/merchant-stores/{StoreIdentification}/signin-credential` answer it, and `PUT` on the store's `signin-key`. Where the store holds none, `SignInCredentialIdentification` is `null`, `AcceptorIdentification` is present, and the attachment's other fields are absent.
      properties:
        StoreIdentification:
          type: string
          pattern: '^mst_[0-9a-f]{32}$'
          x-sent-by: mw
          description: The store.
        SignInCredentialIdentification:
          type: [string, 'null']
          pattern: '^sic_[0-9a-f]{32}$'
          x-sent-by: mw
          description: The credential attached to the store, `null` where none is. Always present.
        KeyIdentification:
          type: [string, 'null']
          pattern: '^[!-~]{1,140}$'
