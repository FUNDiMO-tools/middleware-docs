          anyOf:
            - required: [Secret]
            - required: [SecretEncoding]
      description: What `PUT /v1/merchant-stores/{StoreIdentification}/signin-key` takes.
      properties:
        Adapter:
          type: string
          enum: [signed_value, sandbox_signed_value]
          x-sent-by: vendor
