      responses:
        '200':
          description: The store's credential as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSignIn'
              examples:
                attached:
                  summary: The store and the credential attached to it.
                  value: {"StoreIdentification": "mst_0123456789abcdef0123456789abcdef", "SignInCredentialIdentification": "sic_0123456789abcdef0123456789abcdef", "KeyIdentification": "key-example-1", "Adapter": "signed_value", "Since": "2026-11-20T09:00:00Z", "AcceptorIdentification": "merchant-example-1", "UserName": "user-example-1", "LastResult": null}
        '400':
